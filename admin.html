:root{--bg:#F2F2F2;--surface:#fff;--ink:#111;--muted:#5C5C5C;--line:#D6D6D6;--o:#F26A1B;--ot:#C94F0A;--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-top:env(safe-area-inset-top,0)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.btn{font:600 14px var(--body);border:2px solid var(--o);background:var(--o);color:#1A0E06;padding:7px 14px;border-radius:4px;cursor:pointer;min-height:38px;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:#FF8A45;border-color:#FF8A45}
.btn.out{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.out:hover{background:var(--ink);color:#fff}
.btn.bad{background:transparent;color:#B3261E;border-color:#B3261E}.btn.bad:hover{background:#B3261E;color:#fff}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--surface);border-top:6px solid var(--o);border-radius:8px;padding:26px;width:min(400px,100%);display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
h1,h2{font-family:var(--display);margin:0;line-height:1}
label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--o)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--o)}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ot);font-weight:600;cursor:pointer;min-height:40px}
.err{color:#B3261E;font-weight:600;margin:0;min-height:1.3em}
header{background:#000;color:#fff;border-bottom:3px solid var(--o);position:sticky;top:0;z-index:10}
header .w{gap:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px}
.brand-logo{height:44px;width:auto;display:block;background:#fff;border-radius:6px;padding:2px 6px}
header .w>b,header b{font:700 30px var(--display);color:var(--o)}
header .btn.out{color:#fff;border-color:#fff}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--o);border-radius:6px;padding:14px}
.stat b{display:block;font:700 42px var(--display);line-height:1}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--o);border-color:var(--o);color:#1A0E06}
.sub{margin-top:0}.sub .tab{padding:5px 14px;min-height:36px;font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}.bar select{width:auto;min-width:160px}.bar .sp{flex:1}
.list{display:grid;gap:10px;padding-bottom:50px}
.it{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--o);border-radius:6px;padding:14px 16px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.it h3{font:700 24px var(--display);margin:2px 0}
.it small,.muted{color:var(--muted)}
.bd{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--ot);color:var(--ot);border-radius:999px;padding:1px 9px;margin-right:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}.acts select{width:auto;min-height:38px;padding:4px 8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--muted)}
dialog{border:0;padding:0;border-radius:10px;width:min(720px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#000;color:#fff;border-bottom:3px solid var(--o);position:sticky;top:0}
.dh h2{font-size:26px}.dh button{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:none;color:#fff;font-size:22px;cursor:pointer}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px}.fg .full{grid-column:1/-1}
.df{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 16px}
.cr{display:flex;gap:8px}.cr input{flex:1}
[hidden]{display:none!important}
@media(max-width:640px){.fg{grid-template-columns:1fr}}
</style></head><body>

  var q=function(t,o){return db.from(t).select('*').order(o,{ascending:o==='sort_order'})};
  var r=await Promise.all([q('listings','created_at'),q('bookings','created_at'),q('jobs','created_at'),q('job_applications','created_at'),q('job_categories','sort_order')]);
  D.listings=r[0].data||[];D.bookings=r[1].data||[];D.jobs=r[2].data||[];D.apps=r[3].data||[];D.cats=r[4].data||[];
  var n=function(a,k,v){return a.filter(function(x){return x[k]===v}).length};
  $('stats').innerHTML=[['Listings to review',n(D.listings,'status','pending')],['Live listings',n(D.listings,'status','approved')],['New bookings',n(D.bookings,'status','new')],['Open roles',n(D.jobs,'status','open')],['New applications',n(D.apps,'status','new')]].map(function(x){return'<div class="stat"><b>'+x[1]+'</b>'+x[0]+'</div>'}).join('');
  draw()}
function tabs(el,arr,cur){el.innerHTML=arr.map(function(t){return'<button class="tab" role="tab" data-k="'+t[0]+'" aria-selected="'+(t[0]===cur)+'">'+t[1]+'</button>'}).join('')}
function draw(){
  tabs($('nav'),NAV,tab);$('sub').hidden=tab!=='hiring';if(tab==='hiring')tabs($('sub'),SUB,sub);
  var bar='',st=null,rows=[];
  if(tab==='over'){$('bar').innerHTML='';$('list').innerHTML='<div class="empty">Use the tabs above to review listings, manage bookings and handle hiring. Items waiting for you are counted in the boxes at the top.</div>';return}
  if(tab==='listings'){st=['pending','approved','rejected'];rows=D.listings;bar='<button class="btn" data-add="listings">Add listing</button>'}
  if(tab==='bookings'){st=['new','confirmed','cancelled'];rows=D.bookings}
  if(tab==='hiring'&&sub==='roles'){st=['draft','open','closed'];rows=D.jobs;bar='<button class="btn" data-add="jobs">Add role</button>'}
  if(tab==='hiring'&&sub==='apps'){st=['new','reviewing','shortlisted','rejected'];rows=D.apps}
  if(tab==='hiring'&&sub==='cats'){$('bar').innerHTML='<div class="cr" style="flex:1;max-width:420px"><input id="nc" placeholder="New category, e.g. Marketing" aria-label="New category"><button class="btn" data-addcat>Add</button></div>';
    $('list').innerHTML=D.cats.length?D.cats.map(function(c){return'<div class="it"><b>'+esc(c.name)+'</b><div class="acts"><button class="btn bad" data-del="job_categories" data-id="'+c.id+'">Delete</button></div></div>'}).join(''):'<div class="empty">No categories yet.</div>';return}
  $('bar').innerHTML='<select id="flt" aria-label="Filter by status"><option value="all">All statuses</option>'+st.map(function(s){return'<option value="'+s+'"'+(s===flt?' selected':'')+'>'+cap(s)+'</option>'}).join('')+'</select><span class="sp"></span>'+bar;
  rows=rows.filter(function(x){return flt==='all'||x.status===flt});
  $('list').innerHTML=rows.length?rows.map(row).join(''):'<div class="empty">Nothing here yet.</div>'}
function row(x){var b='<span class="bd">'+esc(x.status)+'</span>',a='';
  if(tab==='listings'){if(x.featured)b+='<span class="bd">featured</span>';
    a=(x.status!=='approved'?'<button class="btn" data-st="listings" data-v="approved" data-id="'+x.id+'">Approve</button>':'')+(x.status!=='rejected'?'<button class="btn out" data-st="listings" data-v="rejected" data-id="'+x.id+'">Reject</button>':'')+'<button class="btn out" data-edit="listings" data-id="'+x.id+'">Edit</button><button class="btn bad" data-del="listings" data-id="'+x.id+'">Delete</button>';
    return'<div class="it"><div>'+b+'<span class="muted">'+esc(x.type)+'</span><h3>'+esc(x.title)+'</h3><small>'+esc([x.town,x.location,kes(x.price),x.contact_name,x.contact_phone].filter(Boolean).join(' · '))+'</small></div><div class="acts">'+a+'</div></div>'}
  if(tab==='bookings'){a=(x.status!=='confirmed'?'<button class="btn" data-st="bookings" data-v="confirmed" data-id="'+x.id+'">Confirm</button>':'')+(x.status!=='cancelled'?'<button class="btn out" data-st="bookings" data-v="cancelled" data-id="'+x.id+'">Cancel</button>':'')+'<a class="btn out" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(x.phone).replace(/\D/g,'').replace(/^0/,'254'))+'">WhatsApp</a><button class="btn bad" data-del="bookings" data-id="'+x.id+'">Delete</button>';
    return'<div class="it"><div>'+b+'<h3>'+esc(x.name)+' <small>'+esc(x.phone)+'</small></h3><small>'+esc(x.listing_title||'Removed listing')+' · '+(x.ticket_type?esc(x.ticket_type)+' · ':'')+x.guests+' guest(s)'+(x.preferred_date?' · '+esc(x.preferred_date):'')+' · '+fd(x.created_at)+'</small>'+(x.message?'<br><small>'+esc(x.message)+'</small>':'')+'</div><div class="acts">'+a+'</div></div>'}
  if(sub==='roles'){var c=D.cats.find(function(k){return k.id===x.category_id});
    a=(x.status!=='open'?'<button class="btn" data-st="jobs" data-v="open" data-id="'+x.id+'">Open</button>':'')+(x.status==='open'?'<button class="btn out" data-st="jobs" data-v="closed" data-id="'+x.id+'">Close</button>':'')+'<button class="btn out" data-edit="jobs" data-id="'+x.id+'">Edit</button><button class="btn bad" data-del="jobs" data-id="'+x.id+'">Delete</button>';
    return'<div class="it"><div>'+b+'<h3>'+esc(x.title)+'</h3><small>'+esc([c&&c.name,x.location,x.job_type,x.deadline&&'Apply by '+x.deadline].filter(Boolean).join(' · '))+'</small></div><div class="acts">'+a+'</div></div>'}
  a='<select data-appst="'+x.id+'" aria-label="Application status">'+['new','reviewing','shortlisted','rejected'].map(function(s){return'<option'+(s===x.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><button class="btn" data-cv="'+esc(x.cv_path)+'">View CV</button><button class="btn bad" data-del="job_applications" data-id="'+x.id+'">Delete</button>';
  return'<div class="it"><div>'+b+'<h3>'+esc(x.full_name)+'</h3><small>'+esc(x.job_title||'General application')+' · '+esc(x.phone)+' · '+esc(x.email)+(x.location?' · '+esc(x.location):'')+' · '+fd(x.created_at)+'</small>'+(x.message?'<br><small>'+esc(x.message.slice(0,220))+'</small>':'')+'</div><div class="acts">'+a+'</div></div>'}

$('nav').onclick=function(e){var b=e.target.closest('[data-k]');if(b){tab=b.dataset.k;flt='all';draw()}};
$('sub').onclick=function(e){var b=e.target.closest('[data-k]');if(b){sub=b.dataset.k;flt='all';draw()}};
$('bar').onchange=function(e){if(e.target.id==='flt'){flt=e.target.value;draw()}};
function fail(r){if(r&&r.error){alert('That did not save: '+r.error.message);return true}return false}
$('bar').onclick=async function(e){
  var a=e.target.closest('[data-add]');if(a)return form(a.dataset.add,null);
  if(e.target.closest('[data-addcat]')){var n=$('nc').value.trim();if(!n)return;if(fail(await db.from('job_categories').insert({name:n,sort_order:D.cats.length+1})))return;load()}};
$('list').onclick=async function(e){
  var b=e.target.closest('button,a');if(!b)return;var d=b.dataset;
  if(d.st){if(fail(await db.from(d.st).update({status:d.v}).eq('id',d.id)))return;load()}
  else if(d.edit)form(d.edit,D[d.edit].find(function(x){return x.id===d.id}));
  else if(d.del){if(!confirm('Delete this? This cannot be undone.'))return;if(fail(await db.from(d.del).delete().eq('id',d.id)))return;load()}
  else if(d.cv){var r=await db.storage.from('job-applications').createSignedUrl(d.cv,120);if(r.error)alert('Could not open the CV.');else window.open(r.data.signedUrl,'_blank','noopener')}};
$('list').onchange=async function(e){var s=e.target.dataset.appst;if(!s)return;if(fail(await db.from('job_applications').update({status:e.target.value}).eq('id',s)))return;load()};

function form(t,row){ed={t:t,row:row};var F=t==='jobs'?JF:LF;$('dt').textContent=(row?'Edit ':'Add ')+(t==='jobs'?'role':'listing');$('de').textContent='';
  $('fg').innerHTML=F.map(function(f){var v=row?row[f[0]]:null,id='f_'+f[0],full=(f[2]==='textarea'||f[0]==='title')?' class="full"':'',h;
    if(f[2]==='catsel')h='<select id="'+id+'"><option value="">Choose a category</option>'+CATS.map(function(c){return'<option'+(c[0]===v?' selected':'')+'>'+esc(c[0])+'</option>'}).join('')+'</select>';
    else if(f[2]==='subsel'){var cc=CATS.filter(function(c){return row&&c[0]===row.category})[0];h='<select id="'+id+'"'+(cc?'':' disabled')+'><option value="">Choose a subcategory</option>'+(cc?cc[1]:[]).map(function(o){return'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
    else if(f[2]==='townsel')h='<select id="'+id+'"><option value="">Choose a town</option>'+TOWNS.map(function(o){return'<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
    else if(f[2]==='select')h='<select id="'+id+'">'+f[3].map(function(o){return'<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
    else if(f[2]==='cat')h='<select id="'+id+'"><option value="">None</option>'+D.cats.map(function(c){return'<option value="'+c.id+'"'+(c.id===v?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>';
    else if(f[2]==='textarea')h='<textarea id="'+id+'">'+esc(v||'')+'</textarea>';
    else if(f[2]==='checkbox')return'<div><label><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'> '+f[1]+'</label></div>';
    else{if(f[2]==='datetime-local'&&v){var d=new Date(v);v=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)}h='<input id="'+id+'" type="'+f[2]+'" value="'+esc(v==null?'':v)+'">'}
    return'<div'+full+'><label for="'+id+'">'+f[1]+'</label>'+h+'</div>'}).join('');
  var fc=$('f_category');if(fc)fc.onchange=function(){var cc=CATS.filter(function(c){return c[0]===fc.value})[0],fs=$('f_subcategory');fs.innerHTML='<option value="">Choose a subcategory</option>'+(cc?cc[1]:[]).map(function(o){return'<option>'+esc(o)+'</option>'}).join('');fs.disabled=!cc};
  $('dlg').showModal()}
$('dx').onclick=$('dc').onclick=function(){$('dlg').close()};
$('df').onsubmit=async function(e){e.preventDefault();var F=ed.t==='jobs'?JF:LF,o={};
  F.forEach(function(f){var el=$('f_'+f[0]),v;if(f[2]==='checkbox')v=el.checked;else{v=el.value.trim();if(v==='')v=null;else if(f[2]==='number')v=+v;else if(f[2]==='datetime-local')v=new Date(v).toISOString()}o[f[0]]=v});
  if(!o.title){$('de').textContent='Enter a title.';return}
  if(ed.t==='listings'&&(!o.category||!o.subcategory)){$('de').textContent='Choose a category and a subcategory.';return}
  var q=db.from(ed.t),r=ed.row?await q.update(o).eq('id',ed.row.id):await q.insert(o);
  if(r.error){$('de').textContent='Could not save: '+r.error.message;return}
  $('dlg').close();load()};
start();
})();
</script></body></html>
