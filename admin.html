.warep input{flex:1;min-width:0;border:0;border-radius:21px;padding:0 16px;min-height:42px;font:15.5px system-ui,sans-serif;background:#fff;color:#111B21}
.wsend{width:44px;height:44px;border-radius:50%;border:0;background:#00A884;color:#fff;font-size:18px;cursor:pointer;flex:none}
@media (max-width:760px){.wa{grid-template-columns:1fr;height:72vh}.wa .wac{display:none}.wa.open .wal{display:none}.wa.open .wac{display:flex}.wback{display:block}}
.cscope{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cadd{margin-bottom:6px}.cfg{display:flex;gap:8px;flex-wrap:wrap}.cfg input{flex:1;min-width:160px}
.chh{margin:22px 0 10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.cgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{border:1px solid rgba(128,128,128,.3);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(128,128,128,.05)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:8px}.chd b{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chp{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:13px;border:1px solid rgba(128,128,128,.35)}
.chp.x{border-color:#F26A1B;background:rgba(242,106,27,.1)}
.chp button{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;padding:0 2px;color:inherit}
.cadd2{display:flex;gap:8px}.cadd2 input{flex:1;min-width:0}
.wav{overflow:hidden}.wav img{width:100%;height:100%;border-radius:50%;object-fit:cover}.sgav{width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
.atd{border:0;border-radius:14px;padding:0;width:min(380px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.45)}.atd::backdrop{background:rgba(0,0,0,.6)}.atf{padding:18px;display:grid;gap:12px}.atf h3{margin:0}.atf label{display:grid;gap:4px;font-weight:600;font-size:14px}.atf input{min-height:44px;padding:0 12px;border-radius:8px;border:2px solid rgba(128,128,128,.4);font:16px system-ui,sans-serif}.atb{display:flex;gap:8px;justify-content:flex-end}
.rt{width:90px;height:60px;object-fit:contain;background:#DCDCE1;border-radius:6px}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.ph{position:relative;margin:0;border:1px solid rgba(128,128,128,.35);border-radius:10px;overflow:hidden;background:#DCDCE1}
.ph img{display:block;width:100%;aspect-ratio:3/2;object-fit:contain;background:#DCDCE1}
.ph.bad div{aspect-ratio:3/2;display:grid;place-items:center;font-size:12px;color:#B00020;text-align:center;padding:6px}
.ph figcaption{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.ph:first-child figcaption{background:#F26A1B;color:#1A0E06;font-weight:700}
.ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.phs.wide .ph img,.phs.wide .ph.bad div{aspect-ratio:16/9}.phs.wide{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
